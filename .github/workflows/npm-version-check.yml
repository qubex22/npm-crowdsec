# =============================================================================
# Weekly NPM + CrowdSec Bouncer Version Check & Image Build
# =============================================================================
#
# On schedule (weekly) and on manual dispatch:
#   1. Resolves the newest jc21/nginx-proxy-manager tag on Docker Hub.
#   2. Resolves the newest crowdsecurity/cs-openresty-bouncer GitHub release.
#   3. Compares BOTH against the last built versions (.npm-version).
#   4. If either one moved, builds and pushes a new image, updates the tracker
#      and cuts a GitHub release.
#
# Before this change only NPM was tracked: the bouncer was hardcoded to 1.1.3,
# so an NPM bump silently rebuilt the image with an old bouncer and reverted
# any manual version pin on the next run.
#
# Manual dispatch inputs (single run only):
#   force_build       — build even when nothing changed
#   crowdsec_version  — pin the bouncer for this build (empty = latest release)
#
# Required secrets (Settings > Secrets and variables > Actions):
#   DOCKER_USERNAME    — GHCR username (e.g. qubex22)
#   DOCKER_PASSWORD    — GHCR password / access token
#
# Images:
#   ghcr.io/qubex22/npm-crowdsec:<npm-version>-cs<bouncer-version>
#   ghcr.io/qubex22/npm-crowdsec:latest
# =============================================================================

name: NPM + CrowdSec Version Check & Build

permissions:
  contents: write
  packages: write

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if no new version"
        type: boolean
        default: false
      crowdsec_version:
        description: "Override CrowdSec bouncer version (empty = latest upstream release)"
        type: string
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/npm-crowdsec
  BOUNCER_REPO: crowdsecurity/cs-openresty-bouncer

concurrency:
  group: npm-crowdsec-build
  cancel-in-progress: false

jobs:
  check-and-build:
    name: Check Versions & Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ------------------------------------------------------------------
      # Step 1: Determine if we need to build
      # ------------------------------------------------------------------
      - name: Check for NPM and CrowdSec bouncer updates
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          FORCE="${{ inputs.force_build || 'false' }}"
          BOUNCER_INPUT="${{ inputs.crowdsec_version || '' }}"

          # Read the last built versions (if the tracker exists)
          LAST_NPM=""
          LAST_BOUNCER=""
          if [ -f .npm-version ]; then
            LAST_NPM=$(sed -n 's/^npm_version=//p' .npm-version | head -1)
            LAST_BOUNCER=$(sed -n 's/^bouncer_version=//p' .npm-version | head -1)
            echo "Last built: NPM=${LAST_NPM:-?}, CrowdSec=${LAST_BOUNCER:-?}"
          else
            echo "No .npm-version file found — first build."
          fi

          # ---- Latest NPM tag on Docker Hub
          NPM_JSON=$(curl -fsSL "https://hub.docker.com/v2/repositories/jc21/nginx-proxy-manager/tags/?page_size=100&ordering=last_updated" || true)
          NPM_VERSION=$(printf '%s' "${NPM_JSON}" | jq -r '.results[] | select(.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) | .name' 2>/dev/null \
            | sort -V | tail -1 || true)
          if [ -z "${NPM_VERSION}" ]; then
            NPM_VERSION="${LAST_NPM:-latest}"
            echo "::warning::Could not resolve the latest NPM tag on Docker Hub — reusing ${NPM_VERSION}."
          fi
          echo "Latest NPM version: ${NPM_VERSION}"

          # ---- Latest upstream bouncer release (releases/latest excludes pre-releases)
          if [ -n "${GH_TOKEN:-}" ]; then
            BOUNCER_JSON=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${BOUNCER_REPO}/releases/latest" || true)
          else
            BOUNCER_JSON=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${BOUNCER_REPO}/releases/latest" || true)
          fi
          UPSTREAM_BOUNCER=$(printf '%s' "${BOUNCER_JSON}" \
            | jq -r 'select(.assets | map(.name) | index("crowdsec-openresty-bouncer.tgz")) | .tag_name // empty' 2>/dev/null \
            | sed 's/^v//' || true)

          DOCKERFILE_BOUNCER=$(sed -n 's/^ARG CROWDSEC_OPENRESTY_BOUNCER_VERSION=//p' Dockerfile | head -1)
          if [ -z "${UPSTREAM_BOUNCER}" ]; then
            # Fall back to the last built version, then to the Dockerfile default.
            UPSTREAM_BOUNCER="${LAST_BOUNCER:-${DOCKERFILE_BOUNCER}}"
            echo "::warning::Could not resolve the latest CrowdSec bouncer release — assuming ${UPSTREAM_BOUNCER}."
          fi
          echo "Latest CrowdSec bouncer release: ${UPSTREAM_BOUNCER}"

          if [ -n "${BOUNCER_INPUT}" ]; then
            BOUNCER_VERSION="${BOUNCER_INPUT#v}"
            echo "CrowdSec bouncer pinned by manual dispatch: ${BOUNCER_VERSION}"
          else
            BOUNCER_VERSION="${UPSTREAM_BOUNCER}"
          fi

          # Only a build that installs the upstream release may move :latest,
          # so pinning an older bouncer can never roll the floating tag back.
          if [ "${BOUNCER_VERSION}" = "${UPSTREAM_BOUNCER}" ]; then
            PUSH_LATEST="true"
          else
            PUSH_LATEST="false"
            echo "::notice::Pinned ${BOUNCER_VERSION} differs from upstream ${UPSTREAM_BOUNCER} — :latest will not be updated."
          fi

          # ---- Decide
          SHOULD_BUILD="false"
          TAG="latest"
          if [ "${FORCE}" = "true" ]; then
            SHOULD_BUILD="true"
            TAG="latest-force-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
            echo "Force build requested."
          elif [ -z "${LAST_NPM}" ] || [ "${NPM_VERSION}" != "${LAST_NPM}" ]; then
            SHOULD_BUILD="true"
            TAG="${NPM_VERSION}-cs${BOUNCER_VERSION}"
            echo "NPM version changed: ${LAST_NPM:-none} -> ${NPM_VERSION}"
          elif [ "${BOUNCER_VERSION}" != "${LAST_BOUNCER}" ]; then
            SHOULD_BUILD="true"
            TAG="${NPM_VERSION}-cs${BOUNCER_VERSION}"
            echo "CrowdSec bouncer changed: ${LAST_BOUNCER:-none} -> ${BOUNCER_VERSION}"
          else
            echo "Already up to date (NPM ${NPM_VERSION}, CrowdSec ${BOUNCER_VERSION}). Skipping build."
          fi

          {
            echo "should_build=$SHOULD_BUILD"
            echo "npm_version=$NPM_VERSION"
            echo "bouncer_version=$BOUNCER_VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

          # Image tags: floating :latest (upstream installs only), the versioned
          # combo, plus the unique force tag when a rebuild was forced.
          {
            echo "tags<<TAGS_EOF"
            if [ "${PUSH_LATEST}" = "true" ]; then
              echo "${REGISTRY}/${IMAGE_NAME}:latest"
            fi
            echo "${REGISTRY}/${IMAGE_NAME}:${NPM_VERSION}-cs${BOUNCER_VERSION}"
            if [ "${FORCE}" = "true" ]; then
              echo "${REGISTRY}/${IMAGE_NAME}:${TAG}"
            fi
            echo "TAGS_EOF"
            echo "push_latest=${PUSH_LATEST}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Version check"
            echo ""
            echo "| Component | Detected | Last built |"
            echo "|---|---|---|"
            echo "| Nginx Proxy Manager | \`${NPM_VERSION}\` | \`${LAST_NPM:-—}\` |"
            echo "| CrowdSec bouncer (upstream) | \`${UPSTREAM_BOUNCER}\` | \`${LAST_BOUNCER:-—}\` |"
            echo "| CrowdSec bouncer (building) | \`${BOUNCER_VERSION}\` | |"
            echo ""
            echo "**Build:** ${SHOULD_BUILD} (\`${TAG}\`)"
            if [ "${PUSH_LATEST}" = "false" ]; then
              echo ""
              echo "> Pinned bouncer \`${BOUNCER_VERSION}\` differs from upstream \`${UPSTREAM_BOUNCER}\`: \`:latest\` is left untouched."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Step 2: Set up Docker Buildx (only if building)
      # ------------------------------------------------------------------
      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------------
      # Step 3: Log in to GHCR (only if building)
      # ------------------------------------------------------------------
      - name: Log in to GHCR
        if: steps.check.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ------------------------------------------------------------------
      # Step 4: Build and push (only if building)
      # ------------------------------------------------------------------
      - name: Build and push image
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.check.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.check.outputs.npm_version }}-cs${{ steps.check.outputs.bouncer_version }}
          build-args: |
            NPM_VERSION=${{ steps.check.outputs.npm_version }}
            CROWDSEC_OPENRESTY_BOUNCER_VERSION=${{ steps.check.outputs.bouncer_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------
      # Step 5: Update version tracker (only if built successfully)
      # ------------------------------------------------------------------
      - name: Update version tracker
        if: steps.check.outputs.should_build == 'true'
        run: |
          cat > .npm-version << EOF
          npm_version=${{ steps.check.outputs.npm_version }}
          bouncer_version=${{ steps.check.outputs.bouncer_version }}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          commit=${{ github.sha }}
          EOF
          cat .npm-version

      # ------------------------------------------------------------------
      # Step 6: Commit version update (only if built successfully)
      # ------------------------------------------------------------------
      - name: Commit version update
        if: steps.check.outputs.should_build == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: .npm-version
          commit_message: "ci: update version tracker (${{ steps.check.outputs.npm_version }}-cs${{ steps.check.outputs.bouncer_version }})"
          branch: main

      # ------------------------------------------------------------------
      # Step 7: Create GitHub Release (only if built successfully)
      # ------------------------------------------------------------------
      - name: Create GitHub Release
        if: steps.check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          name: "npm-crowdsec ${{ steps.check.outputs.npm_version }} (CrowdSec ${{ steps.check.outputs.bouncer_version }})"
          body: |
            Automatic build triggered by an upstream version update.

            | Component | Version |
            |---|---|
            | Nginx Proxy Manager | ${{ steps.check.outputs.npm_version }} |
            | CrowdSec OpenResty Bouncer | ${{ steps.check.outputs.bouncer_version }} |

            **Base image:** jc21/nginx-proxy-manager:${{ steps.check.outputs.npm_version }}

            **Pull:**
            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.check.outputs.tag }}
            ```

            `:latest` only moves for builds that install the current upstream bouncer release.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
